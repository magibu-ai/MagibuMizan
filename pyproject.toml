[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "magibumizan"
version = "0.1.0"
description = "Typed probabilistic decisions from open language models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Magibu AI Research Lab"}]
dependencies = []

[project.optional-dependencies]
mlx = ["mlx-lm", "mlx-vlm"]
cuda = ["torch", "transformers", "accelerate"]
server = ["fastapi", "uvicorn"]
test = ["httpx", "fastapi"]

[tool.setuptools.packages.find]
include = ["magibumizan*"]
